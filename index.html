<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rastreador Financeiro</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="container">
      <header class="hero">
        <h1>Rastreador Financeiro</h1>
        <p>Gerencie receitas e despesas com facilidade.</p>
      </header>

      <section class="balance-card">
        <h2>Saldo Atual</h2>
        <p id="saldo">R$ 0,00</p>
      </section>

      <section class="summary">
        <div class="card">
          <h3>Receitas</h3>
          <p id="total-receitas">R$ 0,00</p>
        </div>
        <div class="card">
          <h3>Despesas</h3>
          <p id="total-despesas">R$ 0,00</p>
        </div>
      </section>
            <section class="actions">
        <button id="btn-add" type="button">Nova Transação</button>
      </section>
    <div class="dashboard">
      <section class="transactions">
        <h2>Transações</h2>
        <ul id="lista-transacoes"></ul>
      </section>
      <section class="chart">
        <h2>Resumo Visual</h2>
        <canvas id="grafico"></canvas>
        </section>
      </div>
      <div id="modal" class="modal hidden">
        <div class="modal-content">
          <button id="close-modal" class="close">×</button>
          <h3>Nova Transação</h3>
          <form id="form-transacao">
            <label>Descrição</label>
            <input type="text" id="descricao" required />

            <label>Tipo</label>
            <select id="tipo" required>
              <option value="" selected disabled>
                Selecione o tipo
                </option>
                <option value="receita">
                Receita
                </option>
                <option value="despesa">
                Despesa
                </option>
              </select>
            
            <label>Valor</label>
            <input type="number" id="valor" step="0.01" required />

            <div class="form-actions">
              <button type="submit">Salvar</button>
              <button type="button" id="cancel">Cancelar</button>
            </div>
          </form>
        </div>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
  </body>
</html>
